<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Koffi Basket 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ACCUEIL -->
  <section id="accueil" class="page active">
    <h1>KOFFI BASKET 2026</h1>
    <button onclick="showPage('inscription')">S'INSCRIRE</button>
    <button onclick="showPage('actualites')">📢 ACTUALITÉS</button>
    <button onclick="showPage('admin-login')">ADMIN</button>
  </section>

  <!-- INSCRIPTION -->
  <section id="inscription" class="page">
    <h2>INSCRIPTION</h2>
    <form id="formJoueur">
      <input name="nom" placeholder="Nom complet" required>
      <input name="nationalite" placeholder="Nationalité" required>
      <input name="taille" placeholder="Taille cm" required>
      <input name="poids" placeholder="Poids kg" required>
      <input name="poste" placeholder="Poste" required>
      <input name="email" placeholder="Email" required>
      <input name="whatsapp" placeholder="WhatsApp" required>
      <input name="code_promo" id="codePromo" placeholder="Code promo KOFFI25">
      <p>Prix: <span id="prix">100f</span></p>
      <button type="submit">VALIDER</button>
    </form>
    <button onclick="showPage('accueil')">RETOUR</button>
  </section>

  <!-- ACTUALITÉS -->
  <section id="actualites" class="page">
    <h2>📢 ACTUALITÉS</h2>
    <div id="listeAnnonces">Chargement...</div>
    <button onclick="showPage('accueil')">RETOUR</button>
  </section>

  <!-- LOGIN ADMIN -->
  <section id="admin-login" class="page">
    <h2>CONNEXION ADMIN</h2>
    <input type="password" id="adminPass" placeholder="Mot de passe">
    <button type="button" onclick="loginAdmin()">SE CONNECTER</button>
    <button onclick="showPage('accueil')">RETOUR</button>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="page">
    <div class="admin-header">
      <h2>PANEL ADMIN</h2>
      <button type="button" onclick="logout()" class="btn-danger">DÉCONNEXION</button>
    </div>
    <div id="statsReelles"></div>
    <button type="button" onclick="publierAnnonce()">📢 PUBLIER UNE ANNONCE</button>
    <h3>LISTE JOUEURS EN ATTENTE</h3>
    <table><tbody id="listeJoueurs"></tbody></table>
  </section>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="script.js"></script>
</body>
  </html>
